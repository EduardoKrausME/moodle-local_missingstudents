name: Auto-release via commit message

on: [push]

permissions:
  contents: write

jobs:
  auto-release:
    if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'V ')

    runs-on:
      ubuntu-latest

    outputs:
      tag: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version of the commit message.
        id: ver
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^V [0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version in the commit message."
          fi

      - name: Close if there is no version.
        if: steps.ver.outputs.version == ''
        run: |
          echo "Ignoring: commit is not a release."

      - name: Create annotated tag
        if: steps.ver.outputs.version != ''
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usa sem prefixo (ex.: 1.2.3)
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Package installable ZIP
        if: steps.ver.outputs.version != ''
        run: |
          git archive --format=zip --prefix=missingstudents/ -o missingstudents.zip HEAD
          unzip -Z -1 missingstudents.zip | grep -q '^missingstudents/version.php
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}

            For installation, use the attached missingstudents.zip, not Source code (zip).
          files: missingstudents.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

          if unzip -Z -1 missingstudents.zip | grep -v '^missingstudents/'; then
            echo "Invalid ZIP root folder" >&2
            exit 1
          fi

      - name: Create a Release on GitHub
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
