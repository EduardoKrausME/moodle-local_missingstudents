name: Auto-release via commit message

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  auto-release:
    if: startsWith(github.event.head_commit.message, 'V ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: ver
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "Invalid release commit message" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Moodle-installable ZIP
        run: |
          git archive --format=zip --prefix=missingstudents/ -o missingstudents.zip HEAD
          unzip -Z -1 missingstudents.zip | grep -Fxq 'missingstudents/version.php'
          if unzip -Z -1 missingstudents.zip | grep -v '^missingstudents/'; then
            echo "ZIP must have missingstudents/ as its only root" >&2
            exit 1
          fi

      - name: Create annotated tag
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub release with installable ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            Release ${{ steps.ver.outputs.version }}.

            Install using the attached missingstudents.zip asset, not GitHub's automatically generated Source code (zip).
          files: missingstudents.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
